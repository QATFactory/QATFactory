# Qwen3.5-9B MXFP4 weight-only quantization-aware distillation.
# Training is W4A16 (weight-only): only weights are fake-quantized; activations stay BF16
# during training. The student starts as the BF16 base with fake-quant active from the
# first forward, so step 0 is exactly the RTN model (a step-0 export IS the RTN baseline).
# The exported checkpoint can be SERVED either W4A16 (Marlin) or W4A4 (FlashInfer, SM100+).
# The NVFP4 recipe shape (8x FSDP2, bf16, global batch 16, cosine lr) with the student
# fake-quantized on the MXFP4 lattice (E2M1 block-32, EVEN-rule E8M0 scales). MXFP4 has no
# global or activation scales, so fused_runtime_scales is off; checkpoints export with
# scripts/export_mxfp4_vllm.py to compressed-tensors mxfp4-pack-quantized.
#
# Schedule: the paper's one epoch at lr 1e-6, global batch 16, identical to the NVFP4 recipe.
# lr 1e-6 relies on FP32 master weights (models.llm.upcast_trainable_to_fp32): in BF16 such small
# updates fall below the ulp and are rounded away.
#
# Launch (8 GPUs; override model/data paths for your layout):
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 WANDB_MODE=online \
#   torchrun --nproc_per_node=8 scripts/train_llm_qat.py \
#     configs/llm/qwen3_5_9b_mxfp4_qad.yaml

model:
  model_path: Qwen/Qwen3.5-9B   # Hub repo id (auto-downloaded) or a local directory
  attn_implementation: flash_attention_2

data:
  # Single conversation JSONL of Qwen3.5-9B OpenPerfectBlend think data, tokenized once with
  # the model's chat template (assistant-only loss mask; `<think>...</think>` embedded in the
  # assistant content is rendered natively) and deterministically split into a disjoint
  # train / held-out eval.
  # Download (docs/data.md): hf download qatfactory/openperfectblend-100k-qwen3.5-9b-think \
  #   --repo-type dataset --local-dir data   (or regenerate: configs/data/openperfectblend_100k_qwen3_5_9b.yaml)
  train_eval_path: data/openperfectblend_100k_Qwen3.5-9B_think_train.jsonl
  eval_size: 128          # held-out example count
  split_seed: 42          # reproducible split
  # Alternative: pre-split files (mutually exclusive with train_eval_path above).
  # train_path: data/openperfectblend_100k_Qwen3.5-9B_think_train.jsonl
  # eval_path: data/openperfectblend_100k_Qwen3.5-9B_think_eval.jsonl
  max_seq_len: 8192
  cache_dir: cache/tokenized   # repo-local, gitignored; reused across runs
  num_proc: 16                 # parallel tokenization workers
  truncate: true               # right-truncate over-length conversations
  # chat_template_file: optional path to override the shipped generation-marked template

train:
  output_dir: outputs/Qwen3.5-9B-mxfp4-qad-openperfectblend-100k-1epoch-lr1e-6
  # Paper schedule, same as the NVFP4 recipe: one epoch, global batch 16, lr 1e-6. A/B on
  # 8x H100 with the same corpus: held-out KL 0.0136 vs 0.0249 for the previous
  # lr 1e-5 / 4000-step / batch-8 schedule (RTN 0.0530).
  num_train_epochs: 1          # one full pass; max_steps unset (-1) so epochs drive the schedule
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-6
  warmup_steps: 0.01   # float < 1 = fraction of total steps (warmup_ratio was removed in transformers 5.1x)
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  weight_decay: 0.0
  optim: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.999
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 1000
  logging_steps: 10
  dataloader_num_workers: 2
  seed: 42
  fsdp: full_shard auto_wrap
  fsdp_config:
    fsdp_version: 2

qad:
  quant_format: mxfp4
  temperature: 1.0
  distill_weight: 1.0
  hard_label_weight: 0.0
  fused_runtime_scales: false
  logits_chunk_size: 2048
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_b
    - in_proj_a
    - out_proj

wandb:
  enable: true
  project: qatfactory-qat
  name: Qwen3.5-9B-MXFP4-QAD-OpenPerfectBlend-100K-1Epoch-LR1e-6

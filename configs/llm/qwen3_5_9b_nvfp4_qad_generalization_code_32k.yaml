# Qwen3.5-9B NVFP4 W4A16 QAD, code domain, 32k context: one arm of the paper's
# sequence-length / cross-domain generalization study (Finding 4).
#
# Data: the code split built by
#   python scripts/generalization/prepare_splits.py --input <answered OPB JSONL> \
#       --ultrainteract-parquet <openbmb/UltraInteract_sft parquet> --output-dir data/generalization
#   python scripts/generalization/require_4k_supervision.py --data-dir data/generalization ...
# The 4K and 32K arms of a domain train on the same conversations with different truncation.
#
# Token budget: stop where the supervised-token count matches the 4K arm (about 307.9M).
# The paper's 32K arms needed 1,817-2,164 steps; max_steps below is the upper end and must
# be set to this arm's exact matched step count.
# Every distillation loss is computed from hidden states (`streamed_logits`), so 32K x 248K
# logits are never materialized; FSDP activation checkpointing replaces HF gradient
# checkpointing.
#
# Launch (8 GPUs): torchrun --nproc_per_node=8 scripts/train_llm_qat.py configs/llm/qwen3_5_9b_nvfp4_qad_generalization_code_32k.yaml

model:
  model_path: Qwen/Qwen3.5-9B
  attn_implementation: flash_attention_2

data:
  train_path: data/generalization/code_train.jsonl
  eval_path: data/generalization/code_eval_monitor.jsonl
  max_seq_len: 32768
  cache_dir: cache/tokenized
  num_proc: 32
  truncate: true

train:
  output_dir: outputs/Qwen3.5-9B-nvfp4-qad-generalization-code-32k
  max_steps: 2164
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2   # global batch 16 on 8 GPUs
  learning_rate: 1.0e-6
  warmup_steps: 0.01
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  weight_decay: 0.0
  bf16: true
  eval_strategy: steps
  eval_steps: 256
  save_strategy: steps
  save_steps: 1024
  save_only_model: false   # keep optimizer state so a resumed run continues it
  logging_steps: 8
  torch_empty_cache_steps: 1
  dataloader_num_workers: 2
  seed: 42
  fsdp: full_shard auto_wrap
  fsdp_config:
    fsdp_version: 2
    state_dict_type: FULL_STATE_DICT
    activation_checkpointing: true

qad:
  quant_format: nvfp4
  quantize_activations: false
  fused_runtime_scales: true
  temperature: 1.0
  distill_weight: 1.0
  hard_label_weight: 0.0
  logits_chunk_size: 256      # supervised tokens per output-head projection
  streamed_logits: true
  kernel_warmup_seq_len: 512
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj,
                   in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]

wandb:
  enable: false
  project: qatfactory-generalization
  name: Qwen3.5-9B-NVFP4-QAD-Code-32K

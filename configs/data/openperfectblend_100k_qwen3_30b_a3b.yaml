# On-policy QAD corpus for configs/llm/qwen3_30b_a3b_nvfp4_qad.yaml: Open Perfect Blend
# prompts (same pool, seed and dedup as the other recipes) answered by Qwen3-30B-A3B itself
# in thinking mode.
#
# Serve first (8x H100: four replicas of two GPUs each):
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 vllm serve Qwen/Qwen3-30B-A3B --revision ad44e777bcd18fa416d9da3bd8f70d33ebb85d39 \
#     --served-model-name Qwen3-30B-A3B --tensor-parallel-size 2 --data-parallel-size 4 \
#     --reasoning-parser qwen3 --max-model-len 16384 --port 8765
#
# Then:
#   python scripts/generate_distill_dataset.py configs/data/openperfectblend_100k_qwen3_30b_a3b.yaml

model:
  model_path: Qwen/Qwen3-30B-A3B
  revision: ad44e777bcd18fa416d9da3bd8f70d33ebb85d39
  chat_template_file: null   # serving template -> on-policy; the QAD template is applied by the trainer
  system_prompt: null
  chat_template_kwargs: {}

prompts:
  dataset: mlabonne/open-perfectblend
  revision: af60f3c18201652a83a93f46fcfee1b646ba3df7
  split: train
  conversation_field: conversations
  role_key: from
  content_key: value
  user_roles: [human, user]
  metadata_fields: [source]
  num_samples: 100000
  seed: 42
  dedup: true
  max_prompt_tokens: 8192

sampling:
  temperature: 1.0
  top_p: 1.0
  max_tokens: 8192
  seed: 42

server:
  base_url: http://127.0.0.1:8765/v1
  model: Qwen3-30B-A3B
  concurrency: 512
  timeout: 3600
  write_batch_size: 512

filter:
  require_stop: true
  require_reasoning: true
  min_answer_chars: 1

output:
  path: data/openperfectblend_100k_Qwen3-30B-A3B_think_train.jsonl
  shuffle_seed: 42

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qatfactory"
version = "0.1.0"
description = "QATFactory: quantization-aware distillation and RL for NVFP4, MXFP4 and Q4_K LLM deployment."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

# Dependencies are intentionally unpinned and packaging-agnostic: a plain PEP 517 package
# installable with `pip install -e .` into any environment (conda, venv, system).
dependencies = [
    "torch>=2.6",
    "transformers>=5.9",
    # 1.13.0's FSDP2 path only pretends to upcast trainable params to FP32 (fixed in 1.14.0).
    # The trainer no longer depends on that upcast, but keep the broken release out anyway.
    "accelerate>=1.0,!=1.13.0",
    "safetensors>=0.4",
    # 5.1.0's Dataset.from_dict fingerprinting raises "PicklingError: Can't pickle
    # <class 'MonthDayNano'>" under every pyarrow/dill tried, which breaks tokenization.
    "datasets>=2.20,!=5.1.0",
    "pyyaml>=6.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2609.39223"
Repository = "https://github.com/QATFactory/QATFactory"

[project.optional-dependencies]
# FlashAttention-2, the recipes' default attn_implementation (override with
# --model.attn_implementation sdpa). Needs a prebuilt wheel or a source build with
# `--no-build-isolation` against the installed torch/CUDA, so it is not a hard dependency.
flash = ["flash-attn>=2.5"]
# Q4_K GGUF export/verify. `gguf` (the llama.cpp/ggml Python package, MIT) is used by the
# exporter to read/write GGUF containers and as the Q4_K dequantization reference. The GGUF
# *container* itself is built by an external llama.cpp `convert_hf_to_gguf.py` (invoked as a
# subprocess; not bundled).
q4k = ["gguf>=0.10"]
# On-policy corpus generation (scripts/generate_distill_dataset.py) talks to a running vLLM
# OpenAI-compatible server over HTTP; vLLM itself is served separately.
data = ["httpx>=0.27"]
# Quantization-aware RL: TRL supplies the GRPO loop, vLLM serves the packed NVFP4 rollout
# engine in-process, and math-verify backs trl.rewards.accuracy_reward.
rl = ["trl>=1.10", "vllm>=0.27", "math-verify>=0.9"]
dev = ["pytest>=7.0", "ruff>=0.4", "gguf>=0.10"]

[tool.pytest.ini_options]
# tests/ is not a package and imports scripts.* from the repository root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["qatfactory*"]

[tool.setuptools.package-data]
"qatfactory.data.templates" = ["*.jinja"]

[tool.ruff]
line-length = 119
target-version = "py310"
